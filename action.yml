name: Verity
description: Launch many Minecraft clients (vanilla, Fabric, Forge, NeoForge) in parallel and test a mod on all of them.
author: prometheusreengineering
branding:
  icon: check-square
  color: green

inputs:
  profile:
    description: Path to a Verity profile JSON (e.g. verity.json in your mod repository).
    required: true
  mode:
    description: >-
      "run" tests the targets. "prepare" installs everything the whole profile needs without launching and saves it
      as the cache; run it in one job per OS before a matrix that uses "only", because those jobs don't save a cache.
    required: false
    default: run
  only:
    description: Comma separated target filters (e.g. "1.20.1-fabric,1.8.9"). Ignored when mode is "prepare".
    required: false
    default: ""
  parallel:
    description: Max clients at once (default from the profile, else automatic).
    required: false
    default: ""
  report-dir:
    description: Where to write report.json, junit.xml, report.html and logs.
    required: false
    default: verity-report
  version:
    description: Verity release to use (tag, e.g. v0.1.0, or "latest"). Ignored when "jar" is set.
    required: false
    default: latest
  jar:
    description: Path to a Verity CLI jar to use instead of downloading a release.
    required: false
    default: ""
  cache:
    description: Cache Minecraft, loaders, libraries and Java runtimes between workflow runs.
    required: false
    default: "true"
  args:
    description: Extra arguments for "verity run".
    required: false
    default: ""

outputs:
  passed:
    description: Number of passing targets.
    value: ${{ steps.summary.outputs.passed }}
  total:
    description: Number of targets.
    value: ${{ steps.summary.outputs.total }}
  report-dir:
    description: Absolute path of the report directory.
    value: ${{ steps.run.outputs.report-dir }}

runs:
  using: composite
  steps:
    - name: Check inputs and pick the cache key
      id: key
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        if [ "$MODE" != run ] && [ "$MODE" != prepare ]; then
          echo "::error::Unknown mode '$MODE' (expected run or prepare)."
          exit 1
        fi
        # Selectors pick up new Minecraft releases without the profile changing, so the cache also rolls over weekly.
        echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

    # One cache per OS and profile, so it holds one copy of the files that every loader shares. It stays unchanged
    # until the key rolls over, and the restore keys let a new one start from the previous one.
    - name: Restore Verity cache
      id: restore
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ runner.temp }}/verity-home/libraries
          ${{ runner.temp }}/verity-home/assets
          ${{ runner.temp }}/verity-home/versions
          ${{ runner.temp }}/verity-home/runtimes
          ${{ runner.temp }}/verity-home/installers
          ${{ runner.temp }}/verity-home/tools
          ${{ runner.temp }}/verity-home/mods-cache
        key: verity-${{ runner.os }}-${{ hashFiles(inputs.profile) }}-${{ steps.key.outputs.week }}
        restore-keys: |
          verity-${{ runner.os }}-${{ hashFiles(inputs.profile) }}-
          verity-${{ runner.os }}-

    - name: Set up Java for Verity
      if: inputs.mode != 'prepare' || steps.restore.outputs.cache-hit != 'true'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    - name: Install virtual display and software OpenGL (Linux)
      if: runner.os == 'Linux' && inputs.mode != 'prepare'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq xvfb x11-xserver-utils libgl1-mesa-dri libglx-mesa0 mesa-utils > /dev/null

    - name: Get Verity
      id: jar
      if: inputs.mode != 'prepare' || steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_JAR: ${{ inputs.jar }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$INPUT_JAR" ]; then
          echo "path=$INPUT_JAR" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        dest="$RUNNER_TEMP/verity-cli.jar"
        if [ "$INPUT_VERSION" = "latest" ]; then
          gh release download --repo prometheusreengineering/verity --pattern 'verity-cli*.jar' --output "$dest" --clobber
        else
          gh release download "$INPUT_VERSION" --repo prometheusreengineering/verity --pattern 'verity-cli*.jar' --output "$dest" --clobber
        fi
        echo "path=$dest" >> "$GITHUB_OUTPUT"

    - name: Run Verity
      id: run
      if: inputs.mode != 'prepare' || steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERITY_HOME: ${{ runner.temp }}/verity-home
        GITHUB_TOKEN: ${{ github.token }}
        MODE: ${{ inputs.mode }}
        PROFILE: ${{ inputs.profile }}
        ONLY: ${{ inputs.only }}
        PARALLEL: ${{ inputs.parallel }}
        REPORT_DIR: ${{ inputs.report-dir }}
        EXTRA: ${{ inputs.args }}
        JAR: ${{ steps.jar.outputs.path }}
      run: |
        report="$(mkdir -p "$REPORT_DIR" && cd "$REPORT_DIR" && pwd)"
        # Git Bash on Windows prints /d/a/...; actions and Java need D:\a\...
        if [ "$RUNNER_OS" = "Windows" ]; then report="$(cygpath -w "$report")"; fi
        echo "report-dir=$report" >> "$GITHUB_OUTPUT"
        args=("$MODE" "$PROFILE" --report-dir "$report")
        [ -n "$ONLY" ] && [ "$MODE" = run ] && args+=(--only "$ONLY")
        [ -n "$PARALLEL" ] && args+=(--parallel "$PARALLEL")
        set +e
        # shellcheck disable=SC2086
        java -jar "$JAR" "${args[@]}" $EXTRA
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Summarize
      id: summary
      if: always() && steps.run.outcome != 'skipped'
      shell: bash
      env:
        REPORT: ${{ steps.run.outputs.report-dir }}
        PYTHONIOENCODING: utf-8
      run: python3 "${{ github.action_path }}/.github/scripts/summary.py" "$REPORT/report.json"

    # A failed prepare saves nothing: an incomplete cache under this key would stay until the key rolls over. A plain
    # run saves too, for workflows with no prepare job, unless "only" means it installed just part of the profile.
    # Exit code 1 is a failing test, which still installed everything.
    - name: Save Verity cache
      if: >-
        inputs.cache == 'true' && steps.restore.outputs.cache-hit != 'true' && (steps.run.outputs.exit-code == '0'
        || (inputs.mode == 'run' && steps.run.outputs.exit-code == '1')) && (inputs.mode == 'prepare' || inputs.only == '')
      uses: actions/cache/save@v4
      with:
        path: |
          ${{ runner.temp }}/verity-home/libraries
          ${{ runner.temp }}/verity-home/assets
          ${{ runner.temp }}/verity-home/versions
          ${{ runner.temp }}/verity-home/runtimes
          ${{ runner.temp }}/verity-home/installers
          ${{ runner.temp }}/verity-home/tools
          ${{ runner.temp }}/verity-home/mods-cache
        key: ${{ steps.restore.outputs.cache-primary-key }}

    - name: Upload reports
      if: always() && steps.run.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: verity-${{ inputs.mode == 'prepare' && 'prepare' || 'report' }}-${{ runner.os }}${{ inputs.mode == 'run' && inputs.only != '' && format('-{0}', inputs.only) || '' }}
        path: ${{ steps.run.outputs.report-dir }}
        if-no-files-found: warn

    - name: Fail on test failures
      if: steps.run.outcome != 'skipped' && steps.run.outputs.exit-code != '0'
      shell: bash
      run: |
        echo "::error::Verity reported failures (exit code ${{ steps.run.outputs.exit-code }}). See the job summary and the verity-report artifact."
        exit 1
