name: Verity
description: Launch many Minecraft clients (vanilla, Fabric, Forge, NeoForge) in parallel and test a mod on all of them.
author: prometheusreengineering
branding:
  icon: check-square
  color: green

inputs:
  profile:
    description: Path to a Verity profile JSON (e.g. verity.json in your mod repository).
    required: true
  mode:
    description: >-
      "run" tests the targets. "prepare" installs everything the whole profile needs without launching and saves it
      as the cache; run it in one job per OS before a matrix that uses "only", because those jobs don't save a cache.
      "plan" decides how to split the profile across runners and outputs the "prepare" and "shards" matrices; pass
      each entry back as "job" (see the README's "Fastest CI").
    required: false
    default: run
  job:
    description: >-
      One entry of a matrix that plan mode made, as toJSON(matrix). It sets the mode, the targets, the clients and the
      caches, so a job needs only this and "profile".
    required: false
    default: ""
  os:
    description: Plan mode. The OSes to test, "linux", "windows" or "linux,windows".
    required: false
    default: linux
  max-runners:
    description: Plan mode. The most runners to use for testing, across all OSes.
    required: false
    default: "20"
  knee-seconds:
    description: Plan mode. Only add a runner if it saves at least this many seconds.
    required: false
    default: "15"
  only:
    description: Comma separated target filters (e.g. "1.20.1-fabric,1.8.9"). Ignored when mode is "prepare".
    required: false
    default: ""
  shard:
    description: >-
      Only run part I of N of the targets (e.g. "2/6"), to split a run across jobs. Ignored when mode is "prepare".
    required: false
    default: ""
  parallel:
    description: Max clients at once (default from the profile, else automatic).
    required: false
    default: ""
  report-dir:
    description: Where to write report.json, junit.xml, report.html and logs.
    required: false
    default: verity-report
  version:
    description: >
      Verity release to use (a tag such as v1.0.0, or "latest"). By default, the release this action was used at:
      @v1.0.0 runs v1.0.0, @v1 the newest v1.x.y release, and a branch or commit the latest release. Ignored when
      "jar" is set.
    required: false
    default: ""
  jar:
    description: Path to a Verity CLI jar to use instead of downloading a release.
    required: false
    default: ""
  cache:
    description: Cache Minecraft, loaders, libraries, mods and Java runtimes between workflow runs.
    required: false
    default: "true"
  args:
    description: Extra arguments for "verity run".
    required: false
    default: ""
  defender:
    description: >-
      Windows only. "off" turns off Defender's real-time scanning for the rest of the job, which makes restoring the
      cache and starting clients much faster on hosted runners (throwaway VMs). "keep" leaves it alone; use that on
      self-hosted runners.
    required: false
    default: "off"

outputs:
  passed:
    description: Number of passing targets.
    value: ${{ steps.summary.outputs.passed }}
  total:
    description: Number of targets.
    value: ${{ steps.summary.outputs.total }}
  report-dir:
    description: Absolute path of the report directory.
    value: ${{ steps.run.outputs.report-dir }}
  prepare:
    description: Plan mode. Matrix of prepare jobs, for strategy.matrix with fromJSON.
    value: ${{ steps.plan.outputs.prepare }}
  shards:
    description: Plan mode. Matrix of test jobs, for strategy.matrix with fromJSON.
    value: ${{ steps.plan.outputs.shards }}
  has-prepare:
    description: Plan mode. "true" when some caches are missing and the prepare matrix has jobs.
    value: ${{ steps.plan.outputs.has-prepare }}

# Two caches per job: one shared by every OS and one for this OS, which together hold the whole Verity home except what
# each run creates. They stay unchanged until the key rolls over, and the restore keys let a new one start from last
# week's. They stop at the profile, because a cache started from another profile would keep its files forever. Paths are
# relative because an absolute path doesn't match across OSes, which is why the home is in the
# workspace. The libraries are matched by file type: the cache action passes a matched directory to tar whole, ignoring
# exclusions in it, and the natives must stay out of the shared cache.
# Left out because Verity rebuilds them for free: each loader version's copy of the client jar (versions/<id> with a
# hyphen; vanilla releases have none), installer jars once their .installed marker exists, and Forge's -slim jars,
# which only feed its installer. Together they were over a third of the shared cache.
runs:
  using: composite
  steps:
    - name: Check inputs and pick the cache keys
      id: key
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        PROFILE: ${{ inputs.profile }}
        JOB: ${{ inputs.job }}
        PARALLEL: ${{ inputs.parallel }}
      run: |
        targets=
        name=
        if [ -n "$JOB" ]; then
          # A planned job: its own targets and its cache group's caches.
          MODE="$(jq -r '.mode' <<< "$JOB")"
          targets="$(jq -r '.targets' <<< "$JOB")"
          name="$(jq -r '.name' <<< "$JOB")"
          key="$(jq -r '.key' <<< "$JOB")"
          [ -n "$PARALLEL" ] || PARALLEL="$(jq -r '.parallel // empty' <<< "$JOB")"
        fi
        if [ "$MODE" != run ] && [ "$MODE" != prepare ] && [ "$MODE" != plan ]; then
          echo "::error::Unknown mode '$MODE' (expected run, prepare or plan)."
          exit 1
        fi
        # Not hashFiles: Windows checks files out with CRLF, which would give each OS its own shared cache. A missing
        # profile is left for Verity to report.
        HASH=none
        if [ -f "$PROFILE" ]; then HASH="$(tr -d '\r' < "$PROFILE" | sha256sum | cut -d' ' -f1)"; fi
        # Selectors pick up new Minecraft releases without the profile changing, so the caches also roll over weekly.
        week="$(date -u +%G-W%V)"
        # A planned job's key already covers the profile, and names its group of targets.
        cache="${key:-$HASH}"
        {
          echo "mode=$MODE"
          echo "targets=$targets"
          echo "name=$name"
          echo "parallel=$PARALLEL"
          echo "week=$week"
          echo "shared=verity-shared-$cache-$week"
          echo "os=verity-$RUNNER_OS-$cache-$week"
          echo "hash=$cache"
          echo "profile-hash=$HASH"
        } >> "$GITHUB_OUTPUT"

    # A prepare job with nothing to do shouldn't download gigabytes to find that out.
    - name: Look for the shared cache
      id: lookup-shared
      if: inputs.cache == 'true' && steps.key.outputs.mode == 'prepare'
      uses: actions/cache/restore@v4
      with:
        lookup-only: true
        enableCrossOsArchive: true
        key: ${{ steps.key.outputs.shared }}
        path: |
          .verity-home/assets
          .verity-home/versions/*/*.json
          .verity-home/versions/*/*.jar
          .verity-home/versions/*/*.txt
          !.verity-home/versions/*-*/*.jar
          .verity-home/installers/*.installed
          .verity-home/mods-cache
          .verity-home/meta-cache
          .verity-home/libraries/**/*.jar
          .verity-home/libraries/**/*.zip
          .verity-home/libraries/**/*.txt
          .verity-home/libraries/**/*.cache
          .verity-home/libraries/**/*.json
          .verity-home/libraries/**/*.lzma
          .verity-home/libraries/**/*.srg
          .verity-home/libraries/**/*.tsrg
          !.verity-home/libraries/**/*natives-*
          !.verity-home/libraries/**/*-slim.jar

    - name: Look for the OS cache
      id: lookup-os
      if: inputs.cache == 'true' && steps.key.outputs.mode == 'prepare'
      uses: actions/cache/restore@v4
      with:
        lookup-only: true
        key: ${{ steps.key.outputs.os }}
        path: |
          .verity-home/runtimes
          .verity-home/tools
          .verity-home/apt
          .verity-home/libraries/**/*natives-*

    - name: Decide what to do
      id: state
      shell: bash
      env:
        SHARED: ${{ steps.lookup-shared.outputs.cache-hit }}
        OS: ${{ steps.lookup-os.outputs.cache-hit }}
      run: |
        if [ "$SHARED" = true ] && [ "$OS" = true ]; then
          echo "The caches for this profile are already complete."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    # Scanning every file the cache restore writes (tens of thousands of assets) is most of a Windows restore.
    - name: Turn off Defender's real-time scanning
      if: >-
        runner.os == 'Windows' && inputs.defender == 'off' && steps.state.outputs.skip != 'true'
        && steps.key.outputs.mode != 'plan'
      shell: pwsh
      run: |
        try {
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
          Write-Host "Defender real-time scanning is off for this job."
        } catch {
          Write-Host "::warning::Couldn't turn off Defender's real-time scanning ($($_.Exception.Message)); set defender: keep to skip this."
        }

    - name: Restore the shared cache
      id: restore-shared
      if: inputs.cache == 'true' && steps.state.outputs.skip != 'true' && steps.key.outputs.mode != 'plan'
      uses: actions/cache/restore@v4
      with:
        enableCrossOsArchive: true
        key: ${{ steps.key.outputs.shared }}
        restore-keys: |
          verity-shared-${{ steps.key.outputs.hash }}-
        path: |
          .verity-home/assets
          .verity-home/versions/*/*.json
          .verity-home/versions/*/*.jar
          .verity-home/versions/*/*.txt
          !.verity-home/versions/*-*/*.jar
          .verity-home/installers/*.installed
          .verity-home/mods-cache
          .verity-home/meta-cache
          .verity-home/libraries/**/*.jar
          .verity-home/libraries/**/*.zip
          .verity-home/libraries/**/*.txt
          .verity-home/libraries/**/*.cache
          .verity-home/libraries/**/*.json
          .verity-home/libraries/**/*.lzma
          .verity-home/libraries/**/*.srg
          .verity-home/libraries/**/*.tsrg
          !.verity-home/libraries/**/*natives-*
          !.verity-home/libraries/**/*-slim.jar

    - name: Restore the OS cache
      id: restore-os
      if: inputs.cache == 'true' && steps.state.outputs.skip != 'true' && steps.key.outputs.mode != 'plan'
      uses: actions/cache/restore@v4
      with:
        key: ${{ steps.key.outputs.os }}
        restore-keys: |
          verity-${{ runner.os }}-${{ steps.key.outputs.hash }}-
        path: |
          .verity-home/runtimes
          .verity-home/tools
          .verity-home/apt
          .verity-home/libraries/**/*natives-*

    - name: Set up Java for Verity
      if: steps.state.outputs.skip != 'true'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"

    # Prepare only collects the packages, for the test jobs to install. The cached packages are for this runner image,
    # which changes over time, so anything they can't install falls back to apt.
    - name: Install virtual display and software OpenGL (Linux)
      if: runner.os == 'Linux' && steps.state.outputs.skip != 'true' && steps.key.outputs.mode != 'plan'
      shell: bash
      env:
        MODE: ${{ steps.key.outputs.mode }}
      run: |
        pkgs="xvfb x11-xserver-utils libgl1-mesa-dri libglx-mesa0 mesa-utils"
        dir="$PWD/.verity-home/apt"
        updated=
        if ! ls "$dir"/*.deb > /dev/null 2>&1; then
          sudo apt-get update -qq
          updated=1
          # Created without sudo so that the Verity home stays writable.
          mkdir -p "$dir/partial"
          # shellcheck disable=SC2086
          sudo apt-get install -y -qq --download-only -o Dir::Cache::archives="$dir" $pkgs > /dev/null
          sudo rm -rf "$dir/partial" "$dir/lock"
          sudo chown -R "$(id -u):$(id -g)" "$dir"
        fi
        [ "$MODE" = prepare ] && exit 0
        if ls "$dir"/*.deb > /dev/null 2>&1; then
          sudo dpkg -i --skip-same-version --refuse-downgrade "$dir"/*.deb > /dev/null 2>&1 || true
        fi
        # shellcheck disable=SC2086
        if ! dpkg -s $pkgs > /dev/null 2>&1 || ! command -v Xvfb > /dev/null; then
          echo "The cached packages didn't install; using apt."
          [ -n "$updated" ] || sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y -qq $pkgs > /dev/null
        fi

    - name: Get Verity
      id: jar
      if: steps.state.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_JAR: ${{ inputs.jar }}
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -n "$INPUT_JAR" ]; then
          echo "path=$INPUT_JAR" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        repo=prometheusreengineering/verity
        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          # The ref the action was used at is the last part of its path (github.action_ref is often empty in
          # composite actions). A CLI from another release may not match this action.yml.
          ref="$(basename "$(printf '%s' "$ACTION_PATH" | tr '\\\\' '/')")"
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            version="$ref"
          elif [[ "$ref" =~ ^v[0-9]+(\.[0-9]+)?$ ]]; then
            # A moving major (or minor) tag: the newest release under it.
            version="$(gh release list --repo "$repo" --exclude-drafts --exclude-pre-releases --limit 100 \
              --json tagName --jq '.[].tagName' | grep -E "^${ref//./\\.}\.[0-9]" | sort -V | tail -n 1 || true)"
            [ -n "$version" ] || { echo "::error::No release under $ref."; exit 1; }
          else
            version=latest
          fi
        fi
        echo "Verity CLI: $version"
        dest="$RUNNER_TEMP/verity-cli.jar"
        if [ "$version" = "latest" ]; then
          gh release download --repo "$repo" --pattern 'verity-cli*.jar' --output "$dest" --clobber
        else
          gh release download "$version" --repo "$repo" --pattern 'verity-cli*.jar' --output "$dest" --clobber
        fi
        echo "path=$dest" >> "$GITHUB_OUTPUT"

    # Learns from the last finished run of this workflow (its timing artifacts) and checks which caches exist, then
    # plans. Both are optional: without "actions: read" it plans from built-in timings, as if nothing were cached.
    - name: Plan the run
      id: plan
      if: steps.key.outputs.mode == 'plan'
      shell: bash
      env:
        VERITY_HOME: ${{ runner.temp }}/verity-plan-home
        GH_TOKEN: ${{ github.token }}
        PROFILE: ${{ inputs.profile }}
        OSES: ${{ inputs.os }}
        MAX_RUNNERS: ${{ inputs.max-runners }}
        KNEE: ${{ inputs.knee-seconds }}
        ONLY: ${{ inputs.only }}
        EXTRA: ${{ inputs.args }}
        JAR: ${{ steps.jar.outputs.path }}
        WEEK: ${{ steps.key.outputs.week }}
        PROFILE_HASH: ${{ steps.key.outputs.profile-hash }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        dir="$RUNNER_TEMP/verity-plan"
        mkdir -p "$dir/history"
        workflow="${GITHUB_WORKFLOW_REF%@*}"
        workflow="${workflow##*/}"
        for branch in "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" "$DEFAULT_BRANCH"; do
          [ -n "$branch" ] || continue
          id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$branch" --status completed --limit 10 \
            --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0].databaseId // empty" 2>/dev/null || true)"
          if [ -n "$id" ] && gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'verity-timing-*' -D "$dir/history" > /dev/null 2>&1; then
            echo "Learning run times from run $id on $branch."
            break
          fi
        done
        : > "$dir/caches.jsonl"
        for ref in "$GITHUB_REF" "refs/heads/$DEFAULT_BRANCH"; do
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100&key=verity-&ref=$ref" \
            --jq '.actions_caches[] | {key, size_in_bytes}' >> "$dir/caches.jsonl" 2>/dev/null \
            || echo "::warning::Couldn't list the caches (needs actions: read); planning as if none exist."
        done
        args=(matrix "$PROFILE" --os "$OSES" --max-runners "$MAX_RUNNERS" --knee-seconds "$KNEE" --week "$WEEK"
          --profile-hash "$PROFILE_HASH" --history "$dir/history" --caches "$dir/caches.jsonl")
        [ -n "$ONLY" ] && args+=(--only "$ONLY")
        # shellcheck disable=SC2086
        java -jar "$JAR" "${args[@]}" $EXTRA > "$dir/plan.json"
        {
          echo "prepare=$(jq -c '.prepare' "$dir/plan.json")"
          echo "shards=$(jq -c '.shards' "$dir/plan.json")"
          echo "has-prepare=$(jq -r '.hasPrepare' "$dir/plan.json")"
        } >> "$GITHUB_OUTPUT"
        jq -r '.summary' "$dir/plan.json" >> "$GITHUB_STEP_SUMMARY"
        jq -r '.summary' "$dir/plan.json"

    - name: Run Verity
      id: run
      if: steps.state.outputs.skip != 'true' && steps.key.outputs.mode != 'plan'
      shell: bash
      env:
        VERITY_HOME: ${{ github.workspace }}/.verity-home
        GITHUB_TOKEN: ${{ github.token }}
        MODE: ${{ steps.key.outputs.mode }}
        PROFILE: ${{ inputs.profile }}
        ONLY: ${{ inputs.only }}
        SHARD: ${{ inputs.shard }}
        TARGETS: ${{ steps.key.outputs.targets }}
        NAME: ${{ steps.key.outputs.name }}
        PARALLEL: ${{ steps.key.outputs.parallel }}
        REPORT_DIR: ${{ inputs.report-dir }}
        EXTRA: ${{ inputs.args }}
        JAR: ${{ steps.jar.outputs.path }}
      run: |
        report="$(mkdir -p "$REPORT_DIR" && cd "$REPORT_DIR" && pwd)"
        # Git Bash on Windows prints /d/a/...; actions and Java need D:\a\...
        if [ "$RUNNER_OS" = "Windows" ]; then report="$(cygpath -w "$report")"; fi
        echo "report-dir=$report" >> "$GITHUB_OUTPUT"
        args=("$MODE" "$PROFILE" --report-dir "$report")
        artifact="$RUNNER_OS"
        if [ -n "$TARGETS" ]; then
          # A planned job (prepare installs just its group, too).
          args+=(--only "$TARGETS")
          artifact="$NAME"
        else
          if [ -n "$ONLY" ] && [ "$MODE" = run ]; then
            args+=(--only "$ONLY")
            artifact="$artifact-$ONLY"
          fi
          if [ -n "$SHARD" ] && [ "$MODE" = run ]; then
            args+=(--shard "$SHARD")
            # An artifact name can't contain a slash.
            artifact="$artifact-shard-${SHARD//\//-of-}"
          fi
        fi
        echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
        [ -n "$PARALLEL" ] && args+=(--parallel "$PARALLEL")
        set +e
        # shellcheck disable=SC2086
        java -jar "$JAR" "${args[@]}" $EXTRA
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

    - name: Summarize
      id: summary
      if: always() && steps.run.outcome != 'skipped'
      shell: bash
      env:
        REPORT: ${{ steps.run.outputs.report-dir }}
        PYTHONIOENCODING: utf-8
      run: python3 "${{ github.action_path }}/.github/scripts/summary.py" "$REPORT/report.json"

    # A failed prepare saves nothing: an incomplete cache under this key would stay until the key rolls over. A plain
    # run saves too, for workflows with no prepare job, unless "only" or "shard" means it installed just part of the profile.
    # Exit code 1 is a failing test, which still installed everything.
    #
    # Nothing regenerates a library missing from the cache, because the installer's marker says it's already installed.
    # The outcome check matters: a skipped step's exit code is null, and null == '0' is true in an expression.
    - name: Check the caches can hold every library
      id: save
      if: >-
        inputs.cache == 'true' && steps.run.outcome == 'success'
        && (steps.run.outputs.exit-code == '0' || (steps.key.outputs.mode == 'run' && steps.run.outputs.exit-code == '1'))
        && (steps.key.outputs.mode == 'prepare' || (inputs.only == '' && inputs.shard == '' && steps.key.outputs.targets == ''))
      shell: bash
      run: |
        missed="$(find .verity-home/libraries -type f ! -name '*natives-*' ! -name '*.jar' ! -name '*.zip' ! -name '*.txt' \
          ! -name '*.cache' ! -name '*.json' ! -name '*.lzma' ! -name '*.srg' ! -name '*.tsrg')"
        if [ -n "$missed" ]; then
          echo "::warning::These libraries won't be cached, so clients that need them will fail: $missed"
          exit 0
        fi
        echo "ok=true" >> "$GITHUB_OUTPUT"

    # If two OSes build the shared cache at once, the second save fails harmlessly: they hold the same files.
    - name: Save the shared cache
      if: steps.save.outputs.ok == 'true' && steps.restore-shared.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        enableCrossOsArchive: true
        key: ${{ steps.key.outputs.shared }}
        path: |
          .verity-home/assets
          .verity-home/versions/*/*.json
          .verity-home/versions/*/*.jar
          .verity-home/versions/*/*.txt
          !.verity-home/versions/*-*/*.jar
          .verity-home/installers/*.installed
          .verity-home/mods-cache
          .verity-home/meta-cache
          .verity-home/libraries/**/*.jar
          .verity-home/libraries/**/*.zip
          .verity-home/libraries/**/*.txt
          .verity-home/libraries/**/*.cache
          .verity-home/libraries/**/*.json
          .verity-home/libraries/**/*.lzma
          .verity-home/libraries/**/*.srg
          .verity-home/libraries/**/*.tsrg
          !.verity-home/libraries/**/*natives-*
          !.verity-home/libraries/**/*-slim.jar

    - name: Save the OS cache
      if: steps.save.outputs.ok == 'true' && steps.restore-os.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: ${{ steps.key.outputs.os }}
        path: |
          .verity-home/runtimes
          .verity-home/tools
          .verity-home/apt
          .verity-home/libraries/**/*natives-*

    - name: Upload reports
      if: always() && steps.run.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: verity-${{ steps.key.outputs.mode == 'prepare' && 'prepare' || 'report' }}-${{ steps.run.outputs.artifact }}
        path: ${{ steps.run.outputs.report-dir }}
        if-no-files-found: warn

    # Just the report, small enough for a later plan to download: it learns this project's run times from it.
    - name: Upload timings
      if: always() && steps.run.outcome != 'skipped' && steps.key.outputs.mode == 'run'
      uses: actions/upload-artifact@v4
      with:
        name: verity-timing-${{ steps.run.outputs.artifact }}
        path: ${{ steps.run.outputs.report-dir }}/report.json
        retention-days: 30
        if-no-files-found: ignore

    - name: Fail on test failures
      if: steps.run.outcome != 'skipped' && steps.run.outputs.exit-code != '0'
      shell: bash
      run: |
        echo "::error::Verity reported failures (exit code ${{ steps.run.outputs.exit-code }}). See the job summary and the verity-report artifact."
        exit 1
