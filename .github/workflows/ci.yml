name: CI

on:
  push:
    # Not tags: release.yml covers them, and a tag's cache can't be restored by anything else.
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the Minecraft matrix (samples/testmod/verity.json)
        type: boolean
        default: true

permissions:
  contents: read
  # Plan mode reads earlier runs' timings and the cache list.
  actions: read

jobs:
  build:
    name: Build & unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb (Linux display tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
      - name: Build
        run: ./gradlew build :verity-cli:shadowJar :samples:testmod:shadowJar :samples:testagent:shadowJar --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ matrix.os }}
          path: "**/build/reports/tests/"
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.os }}
          path: |
            verity-cli/build/libs/verity-cli-*.jar
            samples/testmod/build/libs/verity-testmod-*.jar
            samples/testagent/build/libs/verity-testagent-*.jar

  # The sample mod on the newest patch of every minor version per loader (samples/testmod/verity.json, about 34
  # targets), split across runners by Verity's plan mode. Each cache group's prepare job fills its caches once a week.
  plan:
    name: Plan
    needs: build
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.e2e) }}
    runs-on: ubuntu-latest
    outputs:
      prepare: ${{ steps.plan.outputs.prepare }}
      shards: ${{ steps.plan.outputs.shards }}
      has-prepare: ${{ steps.plan.outputs.has-prepare }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jars-ubuntu-latest
          path: jars
      - name: Place jars
        id: jars
        shell: bash
        run: |
          mkdir -p samples/testmod/build/libs
          cp jars/samples/testmod/build/libs/verity-testmod-*.jar samples/testmod/build/libs/
          mkdir -p samples/testagent/build/libs
          cp jars/samples/testagent/build/libs/verity-testagent-*.jar samples/testagent/build/libs/
          echo "cli=$(ls "$PWD"/jars/verity-cli/build/libs/verity-cli-*-all.jar)" >> "$GITHUB_OUTPUT"
      - id: plan
        uses: ./
        with:
          mode: plan
          profile: samples/testmod/verity.json
          jar: ${{ steps.jars.outputs.cli }}
          # Leaves runners for other workflows; the planner picks 10 for this profile anyway.
          max-runners: "10"

  prepare:
    name: ${{ matrix.name }}
    needs: [build, plan]
    if: ${{ !cancelled() && needs.plan.outputs.has-prepare == 'true' }}
    # The test jobs can still install what they need themselves.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.prepare) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jars-ubuntu-latest
          path: jars
      - name: Place jars
        id: jars
        shell: bash
        run: |
          mkdir -p samples/testmod/build/libs
          cp jars/samples/testmod/build/libs/verity-testmod-*.jar samples/testmod/build/libs/
          mkdir -p samples/testagent/build/libs
          cp jars/samples/testagent/build/libs/verity-testagent-*.jar samples/testagent/build/libs/
          jar="$(ls "$PWD"/jars/verity-cli/build/libs/verity-cli-*-all.jar)"
          if [ "$RUNNER_OS" = "Windows" ]; then jar="$(cygpath -w "$jar")"; fi
          echo "cli=$jar" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          profile: samples/testmod/verity.json
          jar: ${{ steps.jars.outputs.cli }}
          job: ${{ toJSON(matrix) }}

  e2e:
    name: ${{ matrix.name }}
    needs: [build, plan, prepare]
    # Runs after a skipped or failed prepare too, and even if only the Windows unit-test leg failed: it uses the jars
    # built on Linux.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jars-ubuntu-latest
          path: jars
      - name: Place jars
        id: jars
        shell: bash
        run: |
          mkdir -p samples/testmod/build/libs
          cp jars/samples/testmod/build/libs/verity-testmod-*.jar samples/testmod/build/libs/
          mkdir -p samples/testagent/build/libs
          cp jars/samples/testagent/build/libs/verity-testagent-*.jar samples/testagent/build/libs/
          jar="$(ls "$PWD"/jars/verity-cli/build/libs/verity-cli-*-all.jar)"
          if [ "$RUNNER_OS" = "Windows" ]; then jar="$(cygpath -w "$jar")"; fi
          echo "cli=$jar" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          profile: samples/testmod/verity.json
          jar: ${{ steps.jars.outputs.cli }}
          job: ${{ toJSON(matrix) }}
