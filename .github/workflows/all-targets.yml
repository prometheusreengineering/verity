name: All targets

# The sample mod on every Fabric, Forge and NeoForge version Verity supports (samples/testmod/verity-all.json, about
# 127 targets), cold. Launcher bugs hide in older patches (Forge's install and launch files change between them) and
# in first installs, which ci.yml's warm, newest-patch run doesn't reach. Nothing is cached: the caches would take most
# of the repository's 10 GB, and without them each test job installs its own targets, so no prepare jobs run.

on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - .github/workflows/all-targets.yml
      - samples/testmod/verity-all.json
      - samples/testmod/src/**
      - samples/testagent/src/**
  workflow_dispatch:
    inputs:
      only:
        description: Only these targets (comma separated filters, e.g. "1.16.1-forge,26.3"). Empty runs all.
        type: string
        default: ""

permissions:
  contents: read
  # Plan mode reads earlier runs' timings.
  actions: read

concurrency:
  group: all-targets
  cancel-in-progress: false

jobs:
  build:
    name: Build jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :verity-cli:shadowJar :samples:testmod:shadowJar :samples:testagent:shadowJar --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: all-targets-jars
          path: |
            verity-cli/build/libs/verity-cli-*-all.jar
            samples/testmod/build/libs/verity-testmod-*.jar
            samples/testagent/build/libs/verity-testagent-*.jar
          if-no-files-found: error

  # The plan lists prepare jobs too, since it finds no caches; they're left out on purpose (see the top).
  plan:
    name: Plan
    needs: build
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: all-targets-jars
          path: jars
      - name: Place jars
        id: jars
        shell: bash
        run: |
          mkdir -p samples/testmod/build/libs
          cp jars/samples/testmod/build/libs/verity-testmod-*.jar samples/testmod/build/libs/
          mkdir -p samples/testagent/build/libs
          cp jars/samples/testagent/build/libs/verity-testagent-*.jar samples/testagent/build/libs/
          echo "cli=$(ls "$PWD"/jars/verity-cli/build/libs/verity-cli-*-all.jar)" >> "$GITHUB_OUTPUT"
      - id: plan
        uses: ./
        with:
          mode: plan
          os: linux,windows
          profile: samples/testmod/verity-all.json
          jar: ${{ steps.jars.outputs.cli }}
          only: ${{ inputs.only }}

  e2e:
    name: ${{ matrix.name }}
    needs: [build, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: all-targets-jars
          path: jars
      - name: Place jars
        id: jars
        shell: bash
        run: |
          mkdir -p samples/testmod/build/libs
          cp jars/samples/testmod/build/libs/verity-testmod-*.jar samples/testmod/build/libs/
          mkdir -p samples/testagent/build/libs
          cp jars/samples/testagent/build/libs/verity-testagent-*.jar samples/testagent/build/libs/
          jar="$(ls "$PWD"/jars/verity-cli/build/libs/verity-cli-*-all.jar)"
          if [ "$RUNNER_OS" = "Windows" ]; then jar="$(cygpath -w "$jar")"; fi
          echo "cli=$jar" >> "$GITHUB_OUTPUT"
      # Windows clients occasionally die of an access violation (0xC0000005) in early startup, without a JVM error
      # log, with or without the sample agent. Have Windows write a minidump of every crashed java.exe, to see where.
      - name: Turn on crash dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'dumps'
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $wer = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          New-Item -Force $wer | Out-Null
          Set-ItemProperty $wer -Name Disabled -Value 0 -Type DWord
          Set-ItemProperty $wer -Name DontShowUI -Value 1 -Type DWord
          foreach ($exe in 'java.exe', 'javaw.exe') {
            $key = "$wer\LocalDumps\$exe"
            New-Item -Force $key | Out-Null
            Set-ItemProperty $key -Name DumpFolder -Value $dumps -Type ExpandString
            Set-ItemProperty $key -Name DumpType -Value 1 -Type DWord   # minidump
            Set-ItemProperty $key -Name DumpCount -Value 20 -Type DWord
          }
          Write-Host "Minidumps of crashed java.exe go to $dumps"
      - uses: ./
        with:
          profile: samples/testmod/verity-all.json
          jar: ${{ steps.jars.outputs.cli }}
          job: ${{ toJSON(matrix) }}
          cache: "false"
      - name: Analyze crash dumps
        id: dumps
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP 'dumps'
          $files = @(Get-ChildItem $dumps -Filter *.dmp -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { Write-Host 'No crash dumps.'; exit 0 }
          "found=true" >> $env:GITHUB_OUTPUT
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) { Write-Host '::warning::cdb.exe not found; uploading the dumps unanalyzed.'; exit 0 }
          foreach ($f in $files) {
            $out = "$($f.FullName).txt"
            & $cdb.FullName -z $f.FullName -y 'srv*C:\symbols*https://msdl.microsoft.com/download/symbols' `
              -c '.symfix+ C:\symbols; .reload; !analyze -v; .ecxr; kb 40; ~*kb 8; lm; q' *> $out
            Write-Host "::group::$($f.Name)"
            Get-Content $out | Select-String -Pattern 'ExceptionAddress|ExceptionCode|FAULTING_|MODULE_NAME|IMAGE_NAME|SYMBOL_NAME|FAILURE_BUCKET|STACK_TEXT' -Context 0,12 | Out-String -Width 300 | Write-Host
            Write-Host '::endgroup::'
          }
      - name: Upload crash dumps
        if: always() && steps.dumps.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-${{ matrix.name }}
          path: ${{ runner.temp }}/dumps
          retention-days: 14
