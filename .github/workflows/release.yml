name: Release

on:
  push:
    # Full versions only: the moving major tag (v1) that the release job pushes must not release again.
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Both OSes build and test; the jars are the same everywhere, so only Linux uploads them.
      - name: Build and test
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew -Pversion="$version" build :verity-cli:shadowJar :samples:testmod:shadowJar :samples:testagent:shadowJar
          mkdir -p dist
          cp verity-cli/build/libs/verity-cli-*-all.jar dist/verity-cli.jar
          cp verity-api/build/libs/verity-api-"$version"*.jar dist/
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  # Deploys verity-api. Runs only after the build and tests pass on every OS. The order makes a re-run safe:
  # prometheusreengineering/maven can be overwritten, but GitHub Packages rejects a version it already has.
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/checkout@v4
        with:
          repository: prometheusreengineering/maven
          ssh-key: ${{ secrets.MAVEN_REPO_DEPLOY_KEY }}
          path: maven-repo
      - name: Deploy to prometheusreengineering/maven
        run: >
          ./gradlew -Pversion="${GITHUB_REF_NAME#v}" -PprometheusMavenDir="$GITHUB_WORKSPACE/maven-repo"
          :verity-api:publishMavenPublicationToPrometheusRepository
      - name: Push prometheusreengineering/maven
        working-directory: maven-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to deploy: this version is already there."
            exit 0
          fi
          git commit -m "deploy[auto]: ing.prometheusreengineer.verity:verity-api:${GITHUB_REF_NAME#v}"
          # Other projects deploy to this repository too.
          git pull --rebase
          git push
      - name: Deploy to GitHub Packages
        run: ./gradlew -Pversion="${GITHUB_REF_NAME#v}" :verity-api:publishMavenPublicationToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # A fix for an older major (v1.4.1 after v2.0.0) must not become the latest release, which is what the action
      # runs from a branch or commit.
      - name: Check whether this is the newest release
        id: latest
        run: |
          newest="$(git tag --list 'v*.*.*' | grep -v -- - | sort -V | tail -n 1)"
          echo "make=$([ "$newest" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ steps.latest.outputs.make }}
      # Actions users pin @v1; the action then runs the newest v1.x.y CLI. Pre-releases (v1.1.0-rc1) don't move it.
      # Through the REST API: GitHub refuses a git push of a ref that brings in workflow files from the job's token
      # ("without `workflows` permission"). If the API refuses too, the release still stands; move the tag by hand.
      - name: Move the major tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          refs="repos/$GITHUB_REPOSITORY/git/refs"
          if gh api "$refs/tags/$major" --silent 2>/dev/null; then
            ok=$(gh api -X PATCH "$refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true --silent && echo yes || echo no)
          else
            ok=$(gh api -X POST "$refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" --silent && echo yes || echo no)
          fi
          if [ "$ok" = yes ]; then
            echo "Moved $major to $GITHUB_REF_NAME."
          else
            echo "::warning::Couldn't move $major to $GITHUB_REF_NAME. Run: git fetch --tags && git tag -f $major $GITHUB_SHA && git push -f origin refs/tags/$major"
          fi
