name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build jars and app image
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew -Pversion="$version" build :verity-cli:shadowJar :verity-app:shadowJar :verity-app:jpackageImage :samples:testmod:shadowJar
          mkdir -p dist
          cp verity-app/build/libs/verity-*.jar dist/
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp verity-cli/build/libs/verity-cli-*-all.jar dist/verity-cli.jar
            cp verity-api/build/libs/verity-api-"$version"*.jar dist/
            (cd verity-app/build/jpackage && tar czf ../../../dist/Verity-linux-x64.tar.gz Verity)
          else
            (cd verity-app/build/jpackage && 7z a ../../../dist/Verity-windows-x64.zip Verity > /dev/null)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  # Deploys verity-api. Runs only after the build and tests pass on every OS. The order makes a re-run safe:
  # prometheusreengineering/maven can be overwritten, but GitHub Packages rejects a version it already has.
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/checkout@v4
        with:
          repository: prometheusreengineering/maven
          ssh-key: ${{ secrets.MAVEN_REPO_DEPLOY_KEY }}
          path: maven-repo
      - name: Deploy to prometheusreengineering/maven
        run: >
          ./gradlew -Pversion="${GITHUB_REF_NAME#v}" -PprometheusMavenDir="$GITHUB_WORKSPACE/maven-repo"
          :verity-api:publishMavenPublicationToPrometheusRepository
      - name: Push prometheusreengineering/maven
        working-directory: maven-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to deploy: this version is already there."
            exit 0
          fi
          git commit -m "deploy[auto]: ing.prometheusreengineer.verity:verity-api:${GITHUB_REF_NAME#v}"
          # Other projects deploy to this repository too.
          git pull --rebase
          git push
      - name: Deploy to GitHub Packages
        run: ./gradlew -Pversion="${GITHUB_REF_NAME#v}" :verity-api:publishMavenPublicationToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
